name: Public engine checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Validation only: no secrets, a read-only token, nothing published. Safe for pull requests from forks.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
        # head: the pull request's own commits. merged: the merge with its base branch that GitHub proposes,
        # also checked for pull requests into the default branch, where contributions land.
        tree: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch && '["head", "merged"]' || '["head"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.tree == 'merged' && github.sha || github.event.pull_request.head.sha || github.sha }}
          # Full history for the commit-address check.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-test.lock
      - run: python -m pip install --no-build-isolation .
      - run: python -m pytest -q
      - name: Exercise signed example and delta
        run: |
          public-pilot --trust examples/trust.json install examples/demo.snapshot.json
          public-pilot --trust examples/trust.json preview synthetic-example --offline examples/account.json
          public-pilot --trust examples/trust.json install examples/demo.delta.json
          public-pilot --trust examples/trust.json show synthetic-example
      - name: Catalog check
        run: public-pilot catalog check
      - name: Verify every history directory
        run: |
          set -euo pipefail
          shopt -s nullglob
          for edition in history/*/*/; do
            edition="${edition%/}"
            product="$(basename "$(dirname "$edition")")"
            work="$RUNNER_TEMP/$product-$(basename "$edition")"
            mkdir -p "$work"
            public-pilot catalog trust --product "$product" --out "$work/trust.json"
            public-pilot --trust "$work/trust.json" verify-bundle "$edition"
            public-pilot --trust "$work/trust.json" verify-evaluation "$edition/evaluation.json" --snapshot "$edition/edition.snapshot.json"
            public-pilot --state "$work/state" --trust "$work/trust.json" install "$edition/edition.snapshot.json" --allow-expired
            public-pilot --state "$work/state" --trust "$work/trust.json" preview "$product" --offline "$edition/account.fixture.json"
          done
      - name: History index is current
        run: public-pilot history index --check
      - name: Export scan
        env:
          # Commit addresses are those of the pull request's own commits. GitHub's proposed merge commit is never
          # published, and it carries the address of the account that opened the pull request.
          COMMITS: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/export_scan.sh "$COMMITS"

  # The pull request's catalog/ and history/, judged by the base branch's code: the full catalog check plus the
  # append-only rules. This job never installs or runs the pull request's code; it reads its files as data. It
  # judges what would land (the proposed merge for pull requests into the default branch, otherwise the head)
  # against the merge base, so a branch that is behind its base is not mistaken for one that deletes editions.
  base-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.base_ref == github.event.repository.default_branch && github.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Catalog and history pass the base branch's checks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base_commit="$(git merge-base "origin/$BASE_REF" HEAD)"
          if ! git cat-file -e "$base_commit:catalog/authors.json" 2>/dev/null; then
            echo "The base branch has no catalog yet; nothing to compare."
            exit 0
          fi
          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          paths=(src catalog requirements.lock)
          if git cat-file -e "$base_commit:history" 2>/dev/null; then
            paths+=(history)
          fi
          git archive "$base_commit" "${paths[@]}" | tar -x -C "$base"
          # Leave the checkout before running any Python: from inside it, a module in the pull request, such as
          # venv.py or pip.py, would shadow the standard library. -I also keeps the current directory and the
          # PYTHON* variables out of every interpreter. tests/test_workflow.py holds this step to both rules.
          tree="$PWD"
          cd "$RUNNER_TEMP"
          python -I -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -I -m pip install --quiet -r "$base/requirements.lock"
          "$RUNNER_TEMP/venv/bin/python" -I - "$base" "$tree" <<'PY'
          import sys
          from pathlib import Path

          base, tree = Path(sys.argv[1]), Path(sys.argv[2])
          sys.path.insert(0, str(base / "src"))
          from public_pilot.catalog import check
          from public_pilot.common import Refused, now

          try:
              result = check(tree, now(), base)
          except Refused as exc:
              sys.exit(f"Refused: {exc}")
          print("The base branch's code accepts catalog/ and history/, and they only append to the base; "
                f"editions checked: {len(result['editions'])}")
          PY
